name: Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build VANTA Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android Command Line Tools
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found!"
            echo "Expected path: $SDKMANAGER"
            exit 1
          fi

          echo "Android SDK Manager found."

      - name: Accept Android SDK Licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK Packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: |
          gradle --version

      - name: Run Unit Tests
        run: |
          gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK_PATH="VANTA-Launcher/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-debug
          path: VANTA-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
