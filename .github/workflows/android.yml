name: Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build VANTA Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: gradle --version

      - name: Run Unit Tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "app-debug.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated!"
            echo "Checking available APK files..."
            find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK successfully generated!"
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
