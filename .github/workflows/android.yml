name: VANTA Launcher Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VANTA Launcher APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK Components
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: gradle --version

      - name: Run Unit Tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "app-debug.apk" \
            -path "*/build/outputs/apk/debug/*" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not found after Gradle build!"
            echo "Searching for all APK files:"
            find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "================================"
          echo "VANTA APK BUILD SUCCESSFUL"
          echo "================================"
          ls -lh "$APK_PATH"

      - name: Upload VANTA Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Launcher-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
